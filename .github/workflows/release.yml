name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK and import GPG key
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not yield a MAJOR.MINOR.PATCH version (got '$VERSION')"
            exit 1
          fi
          echo "Releasing version $VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build, sign, and publish to Maven Central
        run: mvn -B -ntp -Prelease clean deploy -Dinvoker.skip=true
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Bump to next development version
        run: |
          NEXT_VERSION="$(echo "$RELEASE_VERSION" | awk -F. -v OFS=. '{ $NF += 1; print }')-SNAPSHOT"
          echo "Next development version: $NEXT_VERSION"
          git checkout -f -B main origin/main
          mvn -B -ntp versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
          find cull-it/src/it -path '*/.mvn/extensions.xml' -print0 \
            | xargs -0 sed -i -E '/<artifactId>cull-extension<\/artifactId>/{n;s|<version>[^<]*</version>|<version>'"$NEXT_VERSION"'</version>|}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Prepare for next development iteration"
          git push origin HEAD:main
