# Regression for the "coverage baseline bootstrap" path.
#
# Run 1: clean bootstrap — both tests run, full coverage recorded, and the
#         coverage baseline is persisted into cull's cache (alongside state.bin).
# Run 2: simulate a cache that predates coverage retention (or a persist that
#         never produced a baseline): DELETE the cached .exec baseline but keep
#         the test graph, then mutate Alpha so the graph alone would reselect
#         only AlphaTest. On a clean build that partial run would drop Beta's
#         coverage. cull must instead detect the missing baseline and run the
#         whole suite once to re-capture it, so the report still shows Beta.
invoker.goals.1 = clean verify
invoker.goals.2 = clean antrun:run@delete-baseline antrun:run@mutate-alpha verify
invoker.buildResult = success
