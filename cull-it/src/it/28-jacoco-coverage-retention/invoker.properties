# Run 1: clean bootstrap — both tests run, full coverage recorded and the
#         coverage baseline is persisted into cull's cache.
# Run 2: clean again (wiping target/, so jacoco.exec starts empty), mutate
#         Alpha so only AlphaTest is reselected, then verify. cull seeds the
#         retained baseline back into jacoco.exec; JaCoCo append-merges the
#         AlphaTest subset. The report must still show Beta covered.
invoker.goals.1 = clean verify
invoker.goals.2 = clean antrun:run@mutate-alpha verify
invoker.buildResult = success
